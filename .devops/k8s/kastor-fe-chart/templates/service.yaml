apiVersion: v1
kind: Service
metadata:
  name: kastor-fe-svc
  labels:
    {{- include "kastor-fe-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "kastor-fe-chart.selectorLabels" . | nindent 4 }}
